name: BasePMS API Probe (temporary diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe room_types endpoint
        env:
          BASEPMS_API_TOKEN: ${{ secrets.BASEPMS_API_TOKEN }}
        run: |
          python -m pip install -q requests
          python - <<'EOF'
          import os, requests

          root = "https://hfs.api.basepms.com"
          h = {
              "Authorization": f"Bearer {os.environ['BASEPMS_API_TOKEN']}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          p = requests.get(root + "/api/properties", params={"page": 1}, headers=h)
          print("properties status:", p.status_code)
          resp = p.json()
          items = resp if isinstance(resp, list) else (
              resp.get("data") or resp.get("properties") or resp.get("results") or []
          )
          print("properties on page 1:", len(items))
          first = items[0]
          print("first property:", first.get("id"), "-", first.get("name"))
          print("property list keys:", sorted(first.keys()))

          # Single property detail — does it embed room type info?
          d = requests.get(f"{root}/api/properties/{first['id']}", headers=h)
          print("=" * 50)
          print("property detail status:", d.status_code)
          print("detail body (first 1500 chars):", d.text[:1500])

          # room_types with various params, two different properties
          for pid in [first["id"], items[5].get("id")]:
              for params in [{"academicYear": "2025/2026"},
                             {"academic_year": "2025/2026"},
                             {"year": "2025/2026"},
                             None]:
                  r = requests.get(
                      f"{root}/api/properties/{pid}/room_types",
                      params=params, headers=h,
                  )
                  print("=" * 50)
                  print(f"property {pid} room_types params={params!r} "
                        f"status: {r.status_code} body: {r.text[:300]}")
              print("response headers:", dict(r.headers))
          EOF
