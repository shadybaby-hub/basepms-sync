name: BasePMS API Probe (temporary diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Probe room_types across academic years
        env:
          BASEPMS_API_TOKEN: ${{ secrets.BASEPMS_API_TOKEN }}
        run: |
          python -m pip install -q requests
          python - <<'EOF'
          import os, time, requests

          ROOT = "https://hfs.api.basepms.com"
          YEARS = ["2024/2025", "2025/2026", "2026/2027", "2027/2028"]
          H = {
              "Authorization": f"Bearer {os.environ['BASEPMS_API_TOKEN']}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def to_list(resp):
              if not resp:
                  return []
              if isinstance(resp, list):
                  return resp
              if isinstance(resp, dict):
                  for k in ["data", "results", "items", "properties",
                            "room_types", "instalments"]:
                      if isinstance(resp.get(k), list):
                          return resp[k]
                  return [resp]
              return []

          def get(path, params=None):
              r = requests.get(ROOT + path, params=params, headers=H, timeout=30)
              r.raise_for_status()
              return r.json()

          props = to_list(get("/api/properties", {"page": 1}))
          print(f"properties on page 1: {len(props)}\n")

          # Sample the first 3 properties so one odd listing doesn't skew things.
          for prop in props[:3]:
              print(f"Property {prop.get('id')}: {prop.get('name')}")
              for ay in YEARS:
                  time.sleep(1.1)
                  try:
                      rt = to_list(get(f"/api/properties/{prop['id']}/room_types",
                                       {"academicYear": ay}))
                      insts = sum(len(to_list(x.get("instalments", []))) for x in rt)
                      print(f"    {ay}:  {len(rt):3d} room types, {insts:4d} instalments")
                  except Exception as e:
                      print(f"    {ay}:  ERROR {e}")
              print()
          EOF
