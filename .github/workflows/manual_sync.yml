name: BasePMS Manual Sync

on:
  # Manual trigger only (Actions → BasePMS Manual Sync → Run workflow)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BasePMS sync
        env:
          BASEPMS_API_TOKEN: ${{ secrets.BASEPMS_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MODE: sync
        run: python basepms_sync.py
